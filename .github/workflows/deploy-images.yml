name: Build and push deploy images

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/railway

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        run: az acr login --name cae36c8ae193acr

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: cae36c8ae193acr.azurecr.io/launchaudit-api:latest

      - name: Build and push the broken demo shop image
        uses: docker/build-push-action@v6
        with:
          context: demo-app/broken
          file: demo-app/broken/Dockerfile
          push: true
          tags: cae36c8ae193acr.azurecr.io/launchaudit-demo-broken:latest

      - name: Build and push the fixed demo shop image
        uses: docker/build-push-action@v6
        with:
          context: demo-app/fixed
          file: demo-app/fixed/Dockerfile
          push: true
          tags: cae36c8ae193acr.azurecr.io/launchaudit-demo-fixed:latest
