# Render Blueprint for LaunchAudit.
#
# Deploy from the Render Dashboard: New > Blueprint, pick this repo, choose
# the feat/deploy branch. See docs/deployment.md for the full steps.
#
# No real secrets live in this file. SESSION_SECRET is generated by Render;
# CORS_ORIGINS and FRONTEND_URL are filled in from the dashboard after the
# frontend deploys on Vercel (they take the Vercel URL).

services:
  # The LaunchAudit API (FastAPI). Serves the app at
  # https://launchaudit-api.onrender.com once deployed.
  - type: web
    name: launchaudit-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: launchaudit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Set after the frontend deploys on Vercel: the Vercel app URL, e.g.
      # https://launchaudit.vercel.app (one origin, no trailing slash).
      # Until this is set, the browser cannot call the API (CORS blocks it).
      - key: CORS_ORIGINS
        sync: false
      # Same Vercel app URL as CORS_ORIGINS; the Google OAuth callback
      # redirects here. Only matters once Google sign-in is configured.
      - key: FRONTEND_URL
        sync: false

  # Demo shop, broken variant: the "before" app for the fail to fix demo.
  # Intentionally insecure (planted test secret, failing checkout); it is a
  # demo only, never a real shop. Serves at
  # https://launchaudit-demo-broken.onrender.com once deployed.
  - type: web
    name: launchaudit-demo-broken
    runtime: python
    plan: free
    rootDir: demo-app/broken
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

  # Demo shop, fixed variant: the "after" app for the fail to fix demo.
  # Serves at https://launchaudit-demo-fixed.onrender.com once deployed.
  - type: web
    name: launchaudit-demo-fixed
    runtime: python
    plan: free
    rootDir: demo-app/fixed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

databases:
  - name: launchaudit-db
    plan: free
    databaseName: launchaudit
